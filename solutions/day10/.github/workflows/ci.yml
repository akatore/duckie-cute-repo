name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg sqlite3 curl libdbd-sqlite3-perl

      - name: Unit tests
        run: make test

      - name: End-to-end test
        run: bash run_all.sh
